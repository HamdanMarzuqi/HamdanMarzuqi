name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate snake animation SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: HamdanMarzuqi
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23bb9af7&color_dots=%231a1b27,%23283457,%233d59a1,%237aa2f7,%237dcfff

      - name: push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
